<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="pics/icon.png">
    <title>Weatherwhisper</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/072c72b695.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="bg-scene">
    <i class="fa-solid fa-cloud cloud cloud1"></i>
    <i class="fa-solid fa-cloud cloud cloud2"></i>

    <i class="fa-solid fa-cloud-rain rain-cloud"></i>

    <i class="fa-solid fa-bolt lightning"></i>
</div>
<div class="sun"></div>

    <div class="container">
        <div class="header">

            <div class="search-box">
                <input type="text" placeholder="Enter your location" class="input-box">

                <button class="fa-solid fa-magnifying-glass" id="searchBtn"></button>
            </div>
        </div>

        <div class="location-not-found">
            <h1>Sorry, Location not found!!!</h1>
            <img src="/pics/404.png" alt="404 Error">
        </div>
         <!-- all weather body -->
        <div class="weather-body">
            <img src="/pics/cloud.png" alt="Weather Image" class="weather-img">

            <div class="weather-box">
                <p class="temperature">0 <sup>°C</sup></p>
                <p class="description">light rain</p>
            </div>

            <div class="weather-details">
                <div class="humidity">
                    <i class="fa-sharp fa-solid fa-droplet"></i>
                    <div class="text">
                        <span id="humidity">45%</span>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="wind">
                    <i class="fa-solid fa-wind"></i>
                    <div class="text">
                        <span id="wind-speed">12Km/H</span>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="script.js"></script>

    <!-- for button script -->
    <script src="https://kit.fontawesome.com/595a890311.js" crossorigin="anonymous"></script>
    
</body>
</html>
